<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الطالبات - حاسب آلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2A44;
    --ink-soft:#4A5570;
    --mint:#8FD3C7;
    --mint-deep:#5AB8A8;
    --coral:#F2665E;
    --coral-deep:#D6473F;
    --paper:#F7F8FA;
    --card:#FFFFFF;
    --line:#E4E7EE;
    --danger:#D6473F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Tajawal',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .wrap{
    width:100%;
    max-width:480px;
  }
  .badge{
    display:inline-block;
    background:var(--ink);
    color:#fff;
    font-size:13px;
    font-weight:500;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:16px;
  }
  h1{
    font-size:26px;
    font-weight:800;
    margin:0 0 4px;
    line-height:1.3;
  }
  .meta{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 28px;
    line-height:1.8;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px;
    box-shadow:0 1px 2px rgba(31,42,68,0.04);
  }
  .field{
    margin-bottom:22px;
  }
  .field:last-of-type{
    margin-bottom:0;
  }
  label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
    color:var(--ink);
  }
  label .req{
    color:var(--coral-deep);
    margin-right:2px;
  }
  input[type="text"], input[type="tel"], select{
    width:100%;
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="text"]:focus, input[type="tel"]:focus, select:focus{
    border-color:var(--mint-deep);
  }
  .phone-row{
    display:flex;
    align-items:center;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    overflow:hidden;
  }
  .phone-row:focus-within{
    border-color:var(--mint-deep);
  }
  .phone-prefix{
    padding:12px 14px;
    font-weight:700;
    color:var(--ink-soft);
    border-left:1.5px solid var(--line);
    background:#EFF2F6;
    white-space:nowrap;
  }
  .phone-row input{
    border:none;
    background:transparent;
    flex:1;
    direction:ltr;
    text-align:right;
    padding:12px 14px;
  }
  .phone-row input:focus{
    border:none;
  }
  .hint{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .radio-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .radio-option{
    flex:1;
    min-width:100px;
    position:relative;
  }
  .radio-option input{
    position:absolute;
    opacity:0;
    inset:0;
    cursor:pointer;
    width:100%;
    height:100%;
    margin:0;
  }
  .radio-option .box{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 8px;
    text-align:center;
    font-size:14px;
    font-weight:500;
    background:var(--paper);
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .radio-option input:checked + .box{
    border-color:var(--mint-deep);
    background:var(--mint);
    color:var(--ink);
    font-weight:700;
  }
  .grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%234A5570' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:left 12px center;
    padding-left:36px;
  }
  .submit-btn{
    width:100%;
    margin-top:28px;
    background:var(--coral);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:15px 16px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .15s ease, transform .1s ease;
  }
  .submit-btn:hover{
    background:var(--coral-deep);
  }
  .submit-btn:active{
    transform:scale(0.98);
  }
  .submit-btn:disabled{
    background:#C7CCD6;
    cursor:not-allowed;
  }
  .error-msg{
    color:var(--danger);
    font-size:13px;
    margin-top:6px;
    display:none;
  }
  .error-msg.show{
    display:block;
  }
  .field.has-error input,
  .field.has-error select,
  .field.has-error .phone-row{
    border-color:var(--danger);
  }
  .status{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:14px;
    min-height:18px;
  }
  footer{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:24px;
    opacity:.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">تسجيل الفصل</span>
  <h1>استبيان أسئلة شخصية</h1>
  <p class="meta">المتوسطة الواحدة والعشرون<br>معلمة المادة: ابتسام الشهري</p>

  <div class="card">
    <form id="regForm" novalidate>

      <div class="field" id="field-name">
        <label for="studentName">اسم الطالبة<span class="req">*</span></label>
        <input type="text" id="studentName" placeholder="اكتبي اسمك الكامل">
        <div class="error-msg">اكتبي اسم الطالبة</div>
      </div>

      <div class="field" id="field-style">
        <label>اختاري نمطك في التعلم<span class="req">*</span></label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="style" value="بصري">
            <span class="box">بصري</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="style" value="سمعي">
            <span class="box">سمعي</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="style" value="حركي">
            <span class="box">حركي</span>
          </label>
        </div>
        <div class="error-msg">اختاري نمط التعلم</div>
      </div>

      <div class="field" id="field-phone">
        <label for="studentPhone">اكتبي رقم جوالك ويبدأ 966<span class="req">*</span></label>
        <div class="phone-row">
          <span class="phone-prefix">966+</span>
          <input type="tel" id="studentPhone" placeholder="5XXXXXXXX" maxlength="9" inputmode="numeric">
        </div>
        <div class="hint">أدخلي الرقم بدون صفر في البداية، مثال: 500000000</div>
        <div class="error-msg">تأكدي من رقم الجوال (9 أرقام بعد 966)</div>
      </div>

      <div class="field" id="field-grade">
        <label for="gradeLevel">الصف الدراسي<span class="req">*</span></label>
        <div class="grid-2">
          <select id="gradeLevel">
            <option value="" disabled selected>الصف</option>
            <option value="أول">أول متوسط</option>
            <option value="ثاني">ثاني متوسط</option>
            <option value="ثالث">ثالث متوسط</option>
          </select>
          <select id="sectionNum">
            <option value="" disabled selected>الفصل</option>
            <option value="أول">أول</option>
            <option value="ثاني">ثاني</option>
            <option value="ثالث">ثالث</option>
          </select>
        </div>
        <div class="error-msg">اختاري الصف والفصل</div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        الانضمام لمجموعة الواتساب
      </button>
      <div class="status" id="statusMsg"></div>
    </form>
  </div>
  <footer>بياناتك تُستخدم فقط للتواصل الدراسي مع معلمة المادة</footer>
</div>

<script>
/* ============================================================
   إعدادات لازم تعبّينها قبل النشر
   ============================================================ */

// 1) رابط استقبال ردود نموذج Google Forms (ينتهي بـ /formResponse)
//    خذيه من رابط "معبأ مسبقًا" الذي نسخته: انسخي كل شيء قبل علامة "?"
//    واستبدلي "/viewform" بـ "/formResponse"
const FORM_ACTION_URL = "PASTE_FORM_RESPONSE_URL_HERE";

// 2) أكواد الحقول (entry.XXXXXXXX) من نفس الرابط المعبأ مسبقًا
const ENTRY_NAME  = "entry.NAME_ID_HERE";
const ENTRY_STYLE = "entry.STYLE_ID_HERE";
const ENTRY_PHONE = "entry.PHONE_ID_HERE";
const ENTRY_GRADE = "entry.GRADE_ID_HERE";

/* ============================================================
   روابط مجموعات الواتساب التسع (جاهزة)
   ============================================================ */
const GROUP_LINKS = {
  "أول-أول":   "https://chat.whatsapp.com/DCsK59iGq6jJp5fquRiMhy?s=cl&p=i&mlu=4&ilr=4",
  "أول-ثاني":  "https://chat.whatsapp.com/BP3AEb9gPUH01z2JgSq4wY?s=cl&p=i&mlu=4&ilr=4",
  "أول-ثالث":  "https://chat.whatsapp.com/JuE0bSXe770JjwjXu5abTh?s=cl&p=i&mlu=4&ilr=4",
  "ثاني-أول":  "https://chat.whatsapp.com/CLpettccVWZ9ob3BA2RGk5?s=cl&p=i&mlu=4&ilr=4",
  "ثاني-ثاني": "https://chat.whatsapp.com/JerDw6sACP4DNqQWysiJlR?s=cl&p=i&mlu=4&ilr=4",
  "ثاني-ثالث": "https://chat.whatsapp.com/J4oLztUAmE2FSn24XG2yjf?s=cl&p=i&mlu=4&ilr=4",
  "ثالث-أول":  "https://chat.whatsapp.com/IPcvD9Xa4Ms2fD7LG2ctgQ?s=cl&p=i&mlu=4&ilr=4",
  "ثالث-ثاني": "https://chat.whatsapp.com/L19Go4KTPNi2nfO61esRpQ?s=cl&p=i&mlu=4&ilr=4",
  "ثالث-ثالث": "https://chat.whatsapp.com/Ce0s7DurjtDF0oqAr2RQki?s=cl&p=i&mlu=4&ilr=4"
};

/* ============================================================
   منطق الصفحة (لا حاجة لتعديله)
   ============================================================ */
const form = document.getElementById('regForm');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');

function setError(fieldId, show){
  const field = document.getElementById(fieldId);
  field.classList.toggle('has-error', show);
  const msg = field.querySelector('.error-msg');
  if(msg) msg.classList.toggle('show', show);
}

form.addEventListener('submit', function(e){
  e.preventDefault();

  const name = document.getElementById('studentName').value.trim();
  const style = document.querySelector('input[name="style"]:checked');
  const phoneRaw = document.getElementById('studentPhone').value.trim();
  const grade = document.getElementById('gradeLevel').value;
  const section = document.getElementById('sectionNum').value;

  let valid = true;

  setError('field-name', !name);
  if(!name) valid = false;

  setError('field-style', !style);
  if(!style) valid = false;

  const phoneDigits = phoneRaw.replace(/\D/g, '');
  const phoneValid = /^[5][0-9]{8}$/.test(phoneDigits);
  setError('field-phone', !phoneValid);
  if(!phoneValid) valid = false;

  setError('field-grade', !(grade && section));
  if(!(grade && section)) valid = false;

  if(!valid) return;

  const fullPhone = "966" + phoneDigits;
  const groupKey = grade + "-" + section;
  const groupLink = GROUP_LINKS[groupKey];

  if(!groupLink){
    statusMsg.textContent = "تعذر تحديد مجموعة هذا الفصل، تواصلي مع المعلمة.";
    return;
  }

  submitBtn.disabled = true;
  statusMsg.textContent = "جاري الحفظ...";

  // إرسال البيانات لجدول جوجل شيتس (بدون إعادة تحميل الصفحة)
  const data = new FormData();
  data.append(ENTRY_NAME, name);
  data.append(ENTRY_STYLE, style.value);
  data.append(ENTRY_PHONE, fullPhone);
  data.append(ENTRY_GRADE, grade + " متوسط - فصل " + section);

  fetch(FORM_ACTION_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: data
  }).catch(function(){
    // نتجاهل الخطأ لأن وضع no-cors لا يسمح بقراءة الاستجابة أصلاً
  }).finally(function(){
    statusMsg.textContent = "تم الحفظ، جاري تحويلك للمجموعة...";
    setTimeout(function(){
      window.location.href = groupLink;
    }, 600);
  });
});
</script>
</body>
</html>
